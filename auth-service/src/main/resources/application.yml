server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${AUTH_DB_NAME:auth_db}
    username: ${DB_USERNAME:livebroadcast}
    password: ${DB_PASSWORD:livebroadcast}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # 로컬 개발용 기본값이다. 운영에서는 반드시 JWT_SECRET 환경변수로 덮어쓴다.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    issuer: live-broadcast
    access-token-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:14d}
  internal:
    api-key: ${INTERNAL_API_KEY:local-dev-internal-key}
  cookie:
    secure: ${COOKIE_SECURE:false}
  test-accounts:
    # 원클릭 로그인은 아이디만으로 로그인되므로 기본은 꺼둔다. 평가 기간에만 true 로 켠다.
    enabled: ${TEST_ACCOUNTS_ENABLED:false}
    # 비우면 기동할 때마다 무작위 비밀번호를 써서 아이디/비밀번호 로그인은 막힌다(원클릭 로그인만 가능).
    password: ${TEST_ACCOUNT_PASSWORD:}
    accounts:
      - username: tester1
        nickname: 테스터1
      - username: tester2
        nickname: 테스터2
