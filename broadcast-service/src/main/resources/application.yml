server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: broadcast-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${BROADCAST_DB_NAME:broadcast_db}
    username: ${DB_USERNAME:livebroadcast}
    password: ${DB_PASSWORD:livebroadcast}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    issuer: live-broadcast
  internal:
    api-key: ${INTERNAL_API_KEY:local-dev-internal-key}
  media:
    api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
    playback-url: ${MEDIAMTX_PLAYBACK_URL:http://localhost:9996}
    public-media-base: /media
    public-playback-base: /playback
    recording-root: /recordings
    stale-grace: ${STREAM_STALE_GRACE:3m}
    stale-check-interval: 60s
